name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npx vitest run

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Gateway tests and type check
        working-directory: gateway
        run: |
          node --test "test/*.test.ts"
          ../node_modules/.bin/tsc -p .
